<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Blog - Automac</title>
    <link rel="stylesheet" href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/1.3.0/css/line-awesome.min.css">
    <style>
        :root {
            --primary: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --blue: #3b82f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--light);
            min-height: 100vh;
            display: block;
            padding: 0;
        }
        
        .container {
            background: white;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
        }
        
        h1 {
            color: var(--dark);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }
        
        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .post-list {
            margin-top: 3rem;
            border-top: 2px solid #e5e7eb;
            padding-top: 2rem;
        }

        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .post-actions {
            display: flex;
            gap: 10px;
        }

        .btn-delete {
            background: #ef4444;
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .btn-edit {
            background: var(--blue);
            width: auto;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }
        
        .btn-cancel {
            background: #9ca3af;
            margin-top: 10px;
        }

        .hidden { display: none; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transform: translateY(150%);
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .toast.show { transform: translateY(0); }
        .toast.error { background: #ef4444; }

        /* Tabs Styles */
        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e5e7eb;
        }
        .tab-btn {
            padding: 1rem 2rem;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            width: auto;
        }
        .tab-btn:hover {
            color: var(--primary);
            opacity: 1;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 0;
            padding: 0;
        }
        .sidebar {
            background: linear-gradient(180deg, #0f172a, #1f2937);
            color: #fff;
            border-radius: 0;
            padding: 2rem;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.7rem;
            margin-bottom: 1rem;
        }
        .nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1.5rem 2rem;
            border: none;
            background: transparent;
            color: #e5e7eb;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1.5rem;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .nav-item.active {
            background: rgba(245, 158, 11, 0.2);
            color: #fff;
            outline: 1px solid rgba(245, 158, 11, 0.35);
        }
        .admin-main {
            background: #ffffff;
            border-radius: 0;
            padding: 1rem;
        }
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .stats {
            display: flex;
            gap: 0.75rem;
        }
        .stat-card {
            color: #fff;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            min-width: 110px;
            text-align: center;
        }
        .stat-value {
            font-weight: 800;
            font-size: 1.25rem;
            line-height: 1;
        }
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        /* Preview de imagen */
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN VIEW -->
        <div id="loginView">
            <h1>🔐 Admin Automac</h1>
            <p class="subtitle">Inicia sesión para gestionar el blog</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="admin@automac.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="loginBtn">Ingresar</button>
            </form>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="dashboardView" class="hidden">
            <div class="admin-layout">
                <aside class="sidebar">
                    <div class="brand">
                        <i class="las la-cog"></i>
                        Automac Admin
                    </div>
                    <nav class="nav">
                        <button class="nav-item active" onclick="switchTab('blog')" data-tab="blog">
                            <i class="las la-rss"></i>
                            <span>Blog</span>
                        </button>
                        <button class="nav-item" onclick="switchTab('vacancies')" data-tab="vacancies">
                            <i class="las la-briefcase"></i>
                            <span>Vacantes</span>
                        </button>
                    </nav>
                    <div style="margin-top: 1rem;">
                        <button onclick="logout()" class="nav-item" style="justify-content: center; background: rgba(239,68,68,.15); color: #fff;">
                            <i class="las la-sign-out-alt"></i>
                            <span>Salir</span>
                        </button>
                    </div>
                </aside>
                <main class="admin-main">
                    <div class="main-header">
                        <h1>Panel de Administración</h1>
                        <div class="stats">
                            <div class="stat-card" style="background:#3b82f6;">
                                <div class="stat-value" id="postsCount">0</div>
                                <div class="stat-label">Posts</div>
                            </div>
                            <div class="stat-card" style="background:#f59e0b;">
                                <div class="stat-value" id="vacanciesCount">0</div>
                                <div class="stat-label">Vacantes</div>
                            </div>
                        </div>
                    </div>

            <!-- BLOG SECTION -->
            <div id="blogSection" class="tab-content active">
                <h2 id="formTitle" style="margin-bottom: 1rem;">✍️ Nuevo Post</h2>

                <form id="postForm">
                    <input type="hidden" id="editPostId">
                    
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label>Extracto (Resumen corto)</label>
                        <textarea id="excerpt" rows="2" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Contenido (HTML permitido)</label>
                        <textarea id="content" rows="10" required placeholder="<p>Escribe aquí tu contenido...</p>"></textarea>
                        <small style="color: #666">Tip: Usa etiquetas &lt;p&gt; para párrafos.</small>
                    </div>

                    <div class="form-group">
                        <label>Autor</label>
                        <input type="text" id="author" value="Automac" required>
                    </div>

                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="category">
                            <option>Noticias</option>
                            <option>Historia</option>
                            <option>Productos</option>
                            <option>Eventos</option>
                            <option>Consejos</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Imagen Destacada</label>
                        <input type="file" id="imageInput" accept="image/*">
                        <img id="imagePreview" src="" alt="Vista previa">
                        <!-- Campo oculto para mantener la imagen anterior al editar -->
                        <input type="hidden" id="existingImage">
                    </div>

                    <button type="submit" id="submitBtn">Publicar Post</button>
                    <button type="button" id="cancelBtn" class="btn-cancel hidden" onclick="cancelEdit()">Cancelar Edición</button>
                </form>

                <div class="post-list">
                    <h3>📚 Posts Publicados</h3>
                    <div id="postsContainer">Cargando posts...</div>
                </div>
            </div>

            <!-- VACANCIES SECTION -->
            <div id="vacanciesSection" class="tab-content">
                <h2 id="vacancyFormTitle" style="margin-bottom: 1rem;">💼 Nueva Vacante</h2>
                <form id="vacancyForm">
                    <input type="hidden" id="editVacancyId">
                    
                    <div class="form-group">
                        <label>Título del Puesto</label>
                        <input type="text" id="vacTitle" required placeholder="Ej: Técnico en Maquinaria">
                    </div>

                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="vacCategory">
                            <option>Ventas</option>
                            <option>Servicio Técnico</option>
                            <option>Logística</option>
                            <option>Tecnología</option>
                            <option>Recursos Humanos</option>
                            <option>Administración</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="vacLocation" required placeholder="Ej: Santo Domingo">
                    </div>

                    <div class="form-group">
                        <label>Tipo de Contrato</label>
                        <select id="vacType">
                            <option>Tiempo Completo</option>
                            <option>Medio Tiempo</option>
                            <option>Presencial</option>
                            <option>Remoto</option>
                            <option>Híbrido</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Descripción del Puesto</label>
                        <textarea id="vacDescription" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Responsabilidades (una por línea o separadas por punto)</label>
                        <textarea id="vacResponsibilities" rows="5" required placeholder="Tarea 1&#10;Tarea 2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Requisitos (uno por línea o separados por punto)</label>
                        <textarea id="vacRequirements" rows="5" required placeholder="Requisito 1&#10;Requisito 2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Competencias (separadas por coma)</label>
                        <input type="text" id="vacCompetencies" required placeholder="Ej: Liderazgo, Proactividad, Inglés">
                    </div>

                    <button type="submit" id="submitVacancyBtn">Publicar Vacante</button>
                    <button type="button" id="cancelVacancyBtn" class="btn-cancel hidden" onclick="cancelVacancyEdit()">Cancelar Edición</button>
                </form>

                <div class="post-list">
                    <h3>📋 Vacantes Publicadas</h3>
                    <div id="vacanciesContainer">Cargando vacantes...</div>
                </div>
            </div>
                </main>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Operación exitosa</div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // CONFIGURACIÓN DE TU PROYECTO
        const firebaseConfig = {
            apiKey: "AIzaSyC0EIGduwOGJr2xgeSLMgbUvtXY4iebkC0",
            authDomain: "automac-blog.firebaseapp.com",
            projectId: "automac-blog",
            storageBucket: "automac-blog.firebasestorage.app",
            messagingSenderId: "605756706622",
            appId: "1:605756706622:web:d4bcd05971f43b1845a66f"
        };

        // INICIALIZAR FIREBASE
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ELEMENTOS DOM - BLOG
        const loginView = document.getElementById('loginView');
        const dashboardView = document.getElementById('dashboardView');
        const loginForm = document.getElementById('loginForm');
        const postForm = document.getElementById('postForm');
        const postsContainer = document.getElementById('postsContainer');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const formTitle = document.getElementById('formTitle');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const editPostId = document.getElementById('editPostId');
        const existingImage = document.getElementById('existingImage');

        // ELEMENTOS DOM - VACANTES
        const vacancyForm = document.getElementById('vacancyForm');
        const vacanciesContainer = document.getElementById('vacanciesContainer');
        const vacancyFormTitle = document.getElementById('vacancyFormTitle');
        const submitVacancyBtn = document.getElementById('submitVacancyBtn');
        const cancelVacancyBtn = document.getElementById('cancelVacancyBtn');
        const editVacancyId = document.getElementById('editVacancyId');

        // TABS LOGIC
        window.switchTab = (tabName) => {
            document.querySelectorAll('[data-tab]').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`[data-tab="${tabName}"]`).forEach(el => el.classList.add('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            const targetId = tabName === 'blog' ? 'blogSection' : 'vacanciesSection';
            document.getElementById(targetId).classList.add('active');
        }

        // MANEJO DE ESTADO DE AUTH
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                loadPosts();
                loadVacancies();
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        });

        // LOGIN
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            try {
                btn.textContent = 'Verificando...';
                btn.disabled = true;
                await signInWithEmailAndPassword(auth, email, password);
                showToast('Bienvenido Admin');
            } catch (error) {
                showToast('Error: ' + error.message, true);
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            }
        });

        // LOGOUT GLOBAL
        window.logout = () => signOut(auth);

        // PREVIEW IMAGEN
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // FUNCIÓN MÁGICA: COMPRIMIR IMAGEN A BASE64
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleSize = MAX_WIDTH / img.width;
                        
                        const newWidth = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                        const newHeight = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;

                        canvas.width = newWidth;
                        canvas.height = newHeight;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, newWidth, newHeight);
                        
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // CREAR O ACTUALIZAR POST
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';

            try {
                let imageUrl = existingImage.value; // Mantener imagen anterior por defecto
                
                // 1. Si hay NUEVA imagen, procesarla
                const file = imageInput.files[0];
                if (file) {
                    try {
                        imageUrl = await compressImage(file);
                        if (imageUrl.length > 1000000) {
                            throw new Error("Imagen demasiado grande");
                        }
                    } catch (imgError) {
                        throw new Error("Error procesando la imagen");
                    }
                }

                const postData = {
                    title: document.getElementById('title').value,
                    excerpt: document.getElementById('excerpt').value,
                    content: document.getElementById('content').value,
                    author: document.getElementById('author').value,
                    date: document.getElementById('date').value,
                    category: document.getElementById('category').value,
                    featuredImage: imageUrl,
                    updatedAt: new Date()
                };

                // 2. Decidir si es CREAR o ACTUALIZAR
                if (editPostId.value) {
                    // MODO EDICIÓN
                    await updateDoc(doc(db, "posts", editPostId.value), postData);
                    showToast('Post actualizado exitosamente');
                } else {
                    // MODO CREACIÓN
                    postData.createdAt = new Date(); // Solo al crear
                    await addDoc(collection(db, "posts"), postData);
                    showToast('Post publicado exitosamente');
                }

                cancelEdit(); // Resetear formulario

            } catch (error) {
                console.error(error);
                showToast(error.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = editPostId.value ? 'Actualizar Post' : 'Publicar Post';
            }
        });

        // RESTAURAR POSTS DE EJEMPLO
        window.restoreExamplePosts = async () => {
            if(!confirm('¿Quieres restaurar los posts de ejemplo? Esto agregará 2 posts clásicos a tu blog.')) return;
            
            try {
                const posts = [
                    {
                        title: "Expertos en Maquinaria Pesada",
                        excerpt: "Conoce nuestra trayectoria liderando el mercado de repuestos en República Dominicana.",
                        content: "<p>En Automac, nos enorgullece ser líderes en la importación y distribución de repuestos para maquinaria pesada y camiones. Con años de experiencia en el mercado, garantizamos la calidad y durabilidad de cada pieza que ofrecemos.</p><p>Nuestro compromiso es mantener tu flota en movimiento con las mejores marcas y un servicio personalizado.</p>",
                        author: "Automac",
                        date: "2023-10-15",
                        category: "Historia",
                        featuredImage: "/images/blog/1.webp",
                        createdAt: new Date()
                    },
                    {
                        title: "Mantenimiento Preventivo: La Clave del Éxito",
                        excerpt: "Descubre por qué el mantenimiento regular es vital para la vida útil de tus equipos.",
                        content: "<p>El mantenimiento preventivo no es un gasto, es una inversión. Realizar cambios de aceite, filtros y revisiones periódicas puede extender la vida útil de tu motor por años.</p><p>En Automac contamos con toda la línea de filtros y lubricantes necesarios para que tu maquinaria opere al 100% de su capacidad.</p>",
                        author: "Automac",
                        date: "2023-10-20",
                        category: "Consejos",
                        featuredImage: "/images/blog/2.webp",
                        createdAt: new Date()
                    }
                ];

                for (const post of posts) {
                    await addDoc(collection(db, "posts"), post);
                }
                
                showToast('Posts de ejemplo restaurados');
            } catch (error) {
                console.error(error);
                showToast('Error: ' + error.message, true);
            }
        }

        // CARGAR POSTS (TIEMPO REAL)
        function loadPosts() {
            const q = query(collection(db, "posts"), orderBy("date", "desc"));
            
            onSnapshot(q, (snapshot) => {
                postsContainer.innerHTML = '';
                const pc = document.getElementById('postsCount');
                if (pc) pc.textContent = snapshot.size || 0;
                snapshot.forEach((doc) => {
                    const post = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post-item';
                    div.innerHTML = `
                        <div>
                            <strong>${post.title}</strong><br>
                            <small>${post.date} - ${post.category}</small>
                        </div>
                        <div class="post-actions">
                            <button class="btn-edit" onclick="editPost('${doc.id}')">Editar</button>
                            <button class="btn-delete" onclick="deletePost('${doc.id}')">Eliminar</button>
                        </div>
                    `;
                    postsContainer.appendChild(div);
                });
            });
        }

        // MODO EDICIÓN: Cargar datos en el form
        window.editPost = async (id) => {
            try {
                const docSnap = await getDoc(doc(db, "posts", id));
                if (docSnap.exists()) {
                    const post = docSnap.data();
                    
                    // Llenar formulario
                    editPostId.value = id;
                    document.getElementById('title').value = post.title;
                    document.getElementById('excerpt').value = post.excerpt;
                    document.getElementById('content').value = post.content;
                    document.getElementById('author').value = post.author;
                    document.getElementById('date').value = post.date;
                    document.getElementById('category').value = post.category;
                    existingImage.value = post.featuredImage || '';

                    // Mostrar preview si hay imagen
                    if (post.featuredImage) {
                        imagePreview.src = post.featuredImage;
                        imagePreview.style.display = 'block';
                    } else {
                        imagePreview.style.display = 'none';
                    }

                    // Cambiar interfaz a modo edición
                    formTitle.textContent = "✏️ Editando Post";
                    submitBtn.textContent = "Actualizar Post";
                    cancelBtn.classList.remove('hidden');
                    
                    // Scroll arriba
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (error) {
                showToast("Error al cargar post: " + error.message, true);
            }
        }

        // CANCELAR EDICIÓN
        window.cancelEdit = () => {
            postForm.reset();
            editPostId.value = '';
            existingImage.value = '';
            imagePreview.style.display = 'none';
            imagePreview.src = '';
            
            formTitle.textContent = "✍️ Nuevo Post";
            submitBtn.textContent = "Publicar Post";
            cancelBtn.classList.add('hidden');
        }

        // ELIMINAR POST GLOBAL
        window.deletePost = async (id) => {
            if(confirm('¿Seguro que quieres eliminar este post?')) {
                try {
                    await deleteDoc(doc(db, "posts", id));
                    showToast('Post eliminado');
                    // Si estábamos editando este mismo post, cancelar edición
                    if (editPostId.value === id) {
                        cancelEdit();
                    }
                } catch (error) {
                    showToast('Error eliminando: ' + error.message, true);
                }
            }
        }

        // === LÓGICA DE VACANTES ===

        // CREAR O ACTUALIZAR VACANTE
        vacancyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitVacancyBtn.disabled = true;
            submitVacancyBtn.textContent = 'Procesando...';

            try {
                // Parse lists (split by new lines or bullets)
                const parseList = (text) => text.split(/\n/).map(i => i.replace(/^- /, '').trim()).filter(i => i);
                const parseComma = (text) => text.split(',').map(i => i.trim()).filter(i => i);

                const vacancyData = {
                    title: document.getElementById('vacTitle').value,
                    category: document.getElementById('vacCategory').value,
                    location: document.getElementById('vacLocation').value,
                    type: document.getElementById('vacType').value,
                    description: document.getElementById('vacDescription').value,
                    responsibilities: parseList(document.getElementById('vacResponsibilities').value),
                    requirements: parseList(document.getElementById('vacRequirements').value),
                    competencies: parseComma(document.getElementById('vacCompetencies').value),
                    updatedAt: new Date()
                };

                if (editVacancyId.value) {
                    // Actualizar
                    await updateDoc(doc(db, "vacancies", editVacancyId.value), vacancyData);
                    showToast('Vacante actualizada exitosamente');
                } else {
                    // Crear
                    vacancyData.createdAt = new Date();
                    await addDoc(collection(db, "vacancies"), vacancyData);
                    showToast('Vacante publicada exitosamente');
                }

                cancelVacancyEdit();

            } catch (error) {
                console.error(error);
                showToast(error.message, true);
            } finally {
                submitVacancyBtn.disabled = false;
                submitVacancyBtn.textContent = editVacancyId.value ? 'Actualizar Vacante' : 'Publicar Vacante';
            }
        });

        // CARGAR VACANTES
        function loadVacancies() {
            const q = query(collection(db, "vacancies"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                vacanciesContainer.innerHTML = '';
                if(snapshot.empty) {
                    vacanciesContainer.innerHTML = '<p style="color: #666; font-style: italic;">No hay vacantes publicadas.</p>';
                    const vc = document.getElementById('vacanciesCount');
                    if (vc) vc.textContent = 0;
                    return;
                }
                const vc = document.getElementById('vacanciesCount');
                if (vc) vc.textContent = snapshot.size || 0;

                snapshot.forEach((doc) => {
                    const vac = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post-item';
                    div.innerHTML = `
                        <div>
                            <strong>${vac.title}</strong><br>
                            <small>${vac.category} - ${vac.location} (${vac.type})</small>
                        </div>
                        <div class="post-actions">
                            <button class="btn-edit" onclick="editVacancy('${doc.id}')">Editar</button>
                            <button class="btn-delete" onclick="deleteVacancy('${doc.id}')">Eliminar</button>
                        </div>
                    `;
                    vacanciesContainer.appendChild(div);
                });
            });
        }

        // EDITAR VACANTE
        window.editVacancy = async (id) => {
            try {
                const docSnap = await getDoc(doc(db, "vacancies", id));
                if (docSnap.exists()) {
                    const vac = docSnap.data();
                    
                    editVacancyId.value = id;
                    document.getElementById('vacTitle').value = vac.title;
                    document.getElementById('vacCategory').value = vac.category;
                    document.getElementById('vacLocation').value = vac.location;
                    document.getElementById('vacType').value = vac.type;
                    document.getElementById('vacDescription').value = vac.description;
                    
                    // Join arrays back to text
                    document.getElementById('vacResponsibilities').value = vac.responsibilities.map(i => `- ${i}`).join('\n');
                    document.getElementById('vacRequirements').value = vac.requirements.map(i => `- ${i}`).join('\n');
                    document.getElementById('vacCompetencies').value = vac.competencies.join(', ');

                    vacancyFormTitle.textContent = "✏️ Editando Vacante";
                    submitVacancyBtn.textContent = "Actualizar Vacante";
                    cancelVacancyBtn.classList.remove('hidden');
                    
                    // Switch to vacancies tab if not active (just in case)
                    // But usually we are already there
                    
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (error) {
                showToast("Error al cargar vacante: " + error.message, true);
            }
        }

        // CANCELAR EDICIÓN VACANTE
        window.cancelVacancyEdit = () => {
            vacancyForm.reset();
            editVacancyId.value = '';
            vacancyFormTitle.textContent = "💼 Nueva Vacante";
            submitVacancyBtn.textContent = "Publicar Vacante";
            cancelVacancyBtn.classList.add('hidden');
        }

        // ELIMINAR VACANTE
        window.deleteVacancy = async (id) => {
            if(confirm('¿Seguro que quieres eliminar esta vacante?')) {
                try {
                    await deleteDoc(doc(db, "vacancies", id));
                    showToast('Vacante eliminada');
                    if (editVacancyId.value === id) {
                        cancelVacancyEdit();
                    }
                } catch (error) {
                    showToast('Error eliminando: ' + error.message, true);
                }
            }
        }

        // UTILIDAD TOAST
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = isError ? 'toast show error' : 'toast show';
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }
    </script>
